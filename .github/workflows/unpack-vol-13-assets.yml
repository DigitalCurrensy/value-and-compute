name: Unpack Vol. 13 images

on:
  push:
    paths:
      - "assets/vol-13/images.tar.b64.*"
      - ".github/workflows/unpack-vol-13-assets.yml"

permissions:
  contents: write

jobs:
  unpack:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Unpack images and clean bootstrap files
        run: |
          set -euo pipefail
          cd assets/vol-13
          cat images.tar.b64.* | base64 -d | tar -xf -
          rm -f images.tar.b64 images.tar.b64.*
          test -f og.jpg
          test -f 01-1600.webp
          test -f 11-1000.webp
          cd ../..
          rm -f .github/workflows/unpack-vol-13-assets.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "DigitalCurrensy"
          git config user.email "DigitalCurrensy@users.noreply.github.com"
          git add -A
          git status
          git commit -m "Add Vol. 13 cover and letter images"
          git push

      - name: Set topics and homepage
        continue-on-error: true
        run: |
          gh api -X PATCH repos/${{ github.repository }} -f homepage='https://www.adrianswish.xyz/newsletter' -f description='Value & Compute — letters by Adrian Swish'
          gh api -X PUT repos/${{ github.repository }}/topics -f names[]='newsletter' -f names[]='ai' -f names[]='music' -f names[]='sports' -f names[]='creator-economy'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create draft release for Vol. 13
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create vol-13 \
            --draft \
            --title "Value & Compute, Vol. 13 — The Hands Are Mine Now" \
            --notes-file - <<'NOTES'
The previous volumes described the problem and the posture. This one records the practical result of deciding to own the skill while keeping the judgment that came from the music and sports years.

The hands are mine now. The next volumes will show what they build.

![Value & Compute, Vol. 13 — The Hands Are Mine Now](https://raw.githubusercontent.com/DigitalCurrensy/value-and-compute/main/assets/vol-13/og.jpg)

- [Read on GitHub](https://github.com/DigitalCurrensy/value-and-compute/blob/main/letters/vol-13-the-hands-are-mine-now.md)
- [Site](https://www.adrianswish.xyz/newsletter/vol-13)
- [Substack](https://valuecompute.substack.com/p/value-and-compute-the-hands-are-mine)
- [Medium](https://medium.com/@labeliqai/value-compute-the-hands-are-mine-now-7ac21dbca218)
NOTES
          # Safety: never publish. Confirm it is still a draft.
          draft=$(gh release view vol-13 --json isDraft --jq .isDraft)
          test "$draft" = "true"
